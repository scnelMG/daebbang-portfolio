server:
  port: 8080
  # EC2 보안 원칙: 클라우드 방화벽이 1024~65535 전체 허용이므로 외부 직접 노출 금지.
  # nginx(80/443) 리버스 프록시가 생기기 전까지는 SSH 터널로 접근한다.
  address: 127.0.0.1

spring:
  application:
    name: bangtray-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/bangtray?serverTimezone=Asia/Seoul
    username: bangtray
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마의 단일 원천은 schema.sql — JPA는 검증만
    open-in-view: false

app:
  cors:
    # 브라우저가 보내는 Origin 허용 목록. 배포 도메인이 빠지면 프론트의 POST가 전부 403이 된다.
    # 운영에서 도메인이 바뀌면 코드 수정 없이 CORS_ALLOWED_ORIGINS 로 덮어쓸 것.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

google:
  # 구글 클라우드 콘솔 > 사용자 인증 정보 > OAuth 클라이언트 ID (웹 애플리케이션)의 클라이언트 ID.
  # ID 토큰 검증 방식이라 클라이언트 시크릿은 불필요. 미설정이면 /api/auth/google 이 503으로 응답한다.
  client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  # 운영에서는 반드시 JWT_SECRET 환경변수로 주입 (HS256 — 32바이트 이상 무작위 문자열)
  secret: ${JWT_SECRET}
  access-validity-ms: 1800000     # 30분
  refresh-validity-ms: 1209600000 # 14일
